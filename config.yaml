screen:
  width: 128            # OLED display width in pixels
  height: 64            # OLED display height in pixels
  font_size: 10         # Font size in points
  font: DejaVuSans.ttf  # Font file name or path to TrueType font
  refresh_time: 1       # Time interval (seconds) to refresh and update all command outputs on screen
  scroll_speed: 1       # Delay (seconds) between each scroll step for lines wider than screen
  scroll_step: 20       # Number of pixels to shift text per scroll step
  i2c_bus: 4            # I2C bus number used for the OLED display
  i2c_address: 0x3c     # I2C address of the OLED display

commands:
  - text: "eth0: "      # Label prefix for eth0 IP address
    command: "ip a | grep eth0 | grep inet | awk '{print $2}'"  # Get IP address of eth0 interface
  - text: "tun0: "      # Label prefix for tun0 IP address (VPN tunnel)
    command: "ip a | grep tun0 | grep inet | awk '{print $2}'"  # Get IP address of tun0 interface
  - text: "Temp: "      # Label prefix for temperature sensor reading
    command: "sensors | grep temp1 | awk '{print $2}' | head -n 1"  # Get first temp1 sensor value
  - text: "Disk: "      # Label prefix for disk usage percentage
    command: "df -h | grep /dev/mmcblk1p2 | awk '{print $5}'"     # Get disk usage % of mmcblk1p2 partition
  - text: "Load: "      # Label prefix for system load averages
    command: "uptime | awk -F'load average:' '{print $2}'"       # Get load averages from uptime
  - text: "Time: "      # Label prefix for current local time
    command: "timedatectl | grep 'Local time: ' | awk '{print $5}'"  # Extract current time from timedatectl
